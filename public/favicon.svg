<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f0e0d"/>
  <!-- Border tipis tembaga -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="5.25"
        stroke="#a07850" stroke-width="1.5"/>
  <!-- Monogram MH — font-weight bold, dioptimasi untuk ukuran kecil -->
  <text x="16" y="22" text-anchor="middle"
        font-family="monospace" font-size="14" font-weight="700"
        fill="#e8e0d4" letter-spacing="-0.5">MH</text>
</svg>
